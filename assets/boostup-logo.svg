<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#00D4FF;#00F0FF" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#9333ea;#7c3aed" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4655"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFD700"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <clipPath id="hexClip">
      <polygon points="256 30, 440 135, 440 375, 256 480, 72 375, 72 135"/>
    </clipPath>
  </defs>

  <!-- Background pulse -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="url(#mainGrad)" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="240;250;240" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating outer ring -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#mainGrad)" stroke-width="2" stroke-dasharray="30 15" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="25s" repeatCount="indefinite"/>
  </circle>

  <!-- Counter-rotating inner ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#fireGrad)" stroke-width="1.5" stroke-dasharray="20 10" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="360 256 256" to="0 256 256" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Hexagon background -->
  <polygon points="256 60, 420 155, 420 355, 256 450, 92 355, 92 155" fill="none" stroke="url(#mainGrad)" stroke-width="3" opacity="0.6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
  </polygon>

  <!-- Inner hexagon -->
  <polygon points="256 100, 385 175, 385 335, 256 410, 127 335, 127 175" fill="none" stroke="url(#mainGrad)" stroke-width="2" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </polygon>

  <!-- B Letter - Vertical stroke -->
  <rect x="160" y="160" width="35" height="200" rx="8" fill="url(#mainGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- B Letter - Top loop -->
  <path d="M195 160 L270 160 Q330 160 330 210 Q330 255 285 270 L195 270" fill="none" stroke="url(#mainGrad)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- B Letter - Bottom loop -->
  <path d="M195 270 L285 270 Q350 270 350 320 Q350 370 285 375 L195 375" fill="none" stroke="url(#mainGrad)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Up Arrow -->
  <g filter="url(#glow-strong)">
    <path d="M370 340 L420 260 L435 260 L395 340 L445 340 L445 365 L360 365 L360 340 Z" fill="url(#fireGrad)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="translate" values="0 5;0 -5;0 5" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Speed lines -->
  <g opacity="0.6">
    <line x1="80" y1="200" x2="130" y2="200" stroke="#00F0FF" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="60;100;60" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="240" x2="125" y2="240" stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="50;90;50" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="75" y1="280" x2="120" y2="280" stroke="#FF4655" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="x1" values="55;95;55" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="1.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Floating particles -->
  <circle cx="100" cy="150" r="4" fill="#00F0FF" opacity="0.7">
    <animate attributeName="cy" values="150;120;150" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="180" r="3.5" fill="#7c3aed" opacity="0.6">
    <animate attributeName="cy" values="180;150;180" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.5;4.5;2.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="380" r="3" fill="#FF4655" opacity="0.5">
    <animate attributeName="cy" values="380;350;380" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;4;2" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="400" r="4.5" fill="#00F0FF" opacity="0.6">
    <animate attributeName="cy" values="400;370;400" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;5.5;3.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="80" r="2.5" fill="#FFD700" opacity="0.5">
    <animate attributeName="cy" values="80;60;80" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#mainGrad)" stroke-width="2" opacity="0">
    <animate attributeName="r" values="200;280" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#fireGrad)" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="200;280" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </circle>

  <!-- Text: boostUP -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="url(#mainGrad)" letter-spacing="8" filter="url(#glow)">
    boostUP
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
